<title>Benjamin Gabernig — Cycle of life</title>
<meta name="description" content="Benjamin Gabernig, Senior Product Designer — career as a radial data poster.">
<style>
/* Neue Haas Grotesk Display — loaded from the viewer's installed fonts, Helvetica Neue as fallback */
@font-face{font-family:'NHD';font-weight:300;src:local('NeueHaasDisplay-Light'),local('Neue Haas Grotesk Display Pro 45 Light'),local('HelveticaNeue-Light')}
@font-face{font-family:'NHD';font-weight:400;src:local('NeueHaasDisplay-Roman'),local('Neue Haas Grotesk Display Pro 55 Roman'),local('HelveticaNeue')}
@font-face{font-family:'NHD';font-weight:400;font-style:italic;src:local('NeueHaasDisplay-RomanItalic'),local('Neue Haas Grotesk Display Pro 56 Italic'),local('HelveticaNeue-Italic')}
@font-face{font-family:'NHD';font-weight:500;src:local('NeueHaasDisplay-Mediu'),local('NeueHaasDisplay-Medium'),local('Neue Haas Grotesk Display Pro 65 Medium'),local('HelveticaNeue-Medium')}
@font-face{font-family:'NHD';font-weight:700;src:local('NeueHaasDisplay-Bold'),local('Neue Haas Grotesk Display Pro 75 Bold'),local('HelveticaNeue-Bold')}

/* ── Theme: light (Motto-like) by default, dark = poster ── */
:root{
  --bg:#f2f2f2; --fgc:10 10 10; --fg:rgb(var(--fgc));
  --g1:rgb(var(--fgc) / .62); --g2:rgb(var(--fgc) / .42); --g3:rgb(var(--fgc) / .14);
  --heart-filter:invert(1); --heart-blend:multiply;
  --m:clamp(20px,3.4vw,48px);
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-io:cubic-bezier(.65,0,.35,1);
  --font:'NHD','Neue Haas Grotesk Display Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#000; --fgc:255 255 255;
  --g1:rgb(var(--fgc) / .62); --g2:rgb(var(--fgc) / .4); --g3:rgb(var(--fgc) / .16);
  --heart-filter:none; --heart-blend:normal;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-weight:400;font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden;transition:background-color .5s var(--ease),color .5s var(--ease)}
a{color:inherit}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1.5px solid var(--fg);outline-offset:4px}
::selection{background:var(--fg);color:var(--bg)}
.ul{text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/100% 1px no-repeat;padding-bottom:3px;transition:background-size .5s var(--ease)}
.ul:hover{background-size:0 1px;background-position:100% 100%}
.hl{text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;padding-bottom:3px;transition:background-size .5s var(--ease)}
.hl:hover,.hl[aria-current="page"]{background-size:100% 1px}
.lbl{font-size:13px;font-weight:400;letter-spacing:.01em;font-feature-settings:'tnum' 1}

/* ── Nav ── */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:56px;padding:0 var(--m);background:var(--bg);border-bottom:1px solid var(--g3);font-size:14px;transition:background-color .5s var(--ease)}
.nav .me{justify-self:start;font-weight:500;text-decoration:none;letter-spacing:-.01em}
.nav .views{display:flex;gap:28px}
.nav .act{justify-self:end;display:flex;gap:28px;align-items:center}
.nav .views a{text-decoration:none}
@media (max-width:720px){.nav{grid-template-columns:1fr auto;font-size:13px}.nav .me{display:none}.nav .views{gap:14px}.nav .act{gap:14px}}

/* ── Justified uppercase headline ── */
.jhead{padding:0 var(--m)}
.jrow{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--g3);padding:.04em 0 .02em;overflow:hidden;white-space:nowrap}
.jrow span{display:block;font-weight:400;text-transform:uppercase;letter-spacing:-.025em;line-height:.98;transform:translateY(105%);transition:transform 1.1s var(--ease);transition-delay:calc(var(--i)*70ms)}
.ready .jrow span{transform:none}
.flag{width:.62em;height:.62em;flex:0 0 auto}
.jmeta{display:grid;grid-template-columns:repeat(12,1fr);gap:0 24px;padding:20px 0 0;align-items:end}
.jmeta p{grid-column:5/9;margin:0;font-size:15px;line-height:1.35;max-width:38ch}
.jmeta .l{grid-column:1/5}
.jmeta .r{grid-column:9/13;justify-self:end}
.fade{opacity:0;transition:opacity 1s var(--ease) .5s}
.ready .fade{opacity:1}
@media (max-width:720px){.jmeta{grid-template-columns:1fr;gap:12px}.jmeta p,.jmeta .l,.jmeta .r{grid-column:1;justify-self:start}}

/* ── Section label row ── */
.srow{display:flex;justify-content:space-between;gap:16px;padding:14px var(--m);border-bottom:1px solid var(--g3);margin-top:clamp(40px,6vw,88px)}

/* ── Marquee ── */
.marq{overflow:hidden;border-block:1px solid var(--g3);margin-top:clamp(56px,8vw,120px);padding:.12em 0 .06em}
.marq-in{display:flex;width:max-content;animation:marq 38s linear infinite}
.marq span{font-weight:400;text-transform:uppercase;font-size:clamp(56px,10vw,160px);letter-spacing:-.03em;line-height:1;padding-right:.35em;white-space:nowrap}
.marq:hover .marq-in{animation-play-state:paused}
@keyframes marq{to{transform:translateX(-50%)}}

/* ── Footer ── */
.foot{padding:clamp(40px,6vw,88px) var(--m) 28px;display:grid;grid-template-columns:repeat(12,1fr);gap:0 24px}
.fcol{grid-column:span 4;margin-bottom:56px;border-top:1px solid var(--fg);padding-top:12px}
.fcol.wide{grid-column:span 8}
.fcol h3{margin:0 0 20px;font-weight:400;font-size:13px;color:var(--g1)}
.fcol ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.fcol li{font-size:15px;line-height:1.3}
.fcol li b{font-weight:500}
.fcol li .s{display:block;color:var(--g1)}
.fcol p{margin:0;font-size:15px}
.fcol blockquote{margin:0;font-weight:500;font-size:clamp(22px,2.2vw,32px);line-height:1.1;letter-spacing:-.02em}
.fcol cite{display:block;margin-top:12px;font-style:normal;color:var(--g1);font-size:15px}
.colophon{grid-column:1/-1;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--g3);font-size:13px;color:var(--g1)}
@media (max-width:1000px){.fcol,.fcol.wide{grid-column:span 6}}
@media (max-width:640px){.fcol,.fcol.wide{grid-column:1/-1}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .jrow span{transform:none!important}.fade{opacity:1!important}
}


/* ───────── Data-ring poster ─────────
   Layout: one poster sheet. The rings are the page; title, figures, details and legend sit small in the corners. */
:root{
  --pm:clamp(32px,3.3vw,64px); --cw:clamp(280px,19vw,300px);
  --sheet:#13151b; --ink:#e8eaee; --ink-1:#c2c7d0; --ink-2:#8790a0; --ink-3:#586070;
  --off:#20242c; --c-ft:#f2f3f5; --c-fl:#f2f3f5; --c-ed:#e0b48c; --c-br:#f2f3f5;
  --accent:#2997ff; --hi:#e8eaee; --rule:#2b303a; color-scheme:dark;
  --hl0:#20242c; --hl1:#2f3541; --hl2:#454d5b; --hl3:#6b7486;
}
:root[data-theme="dark"]{
  --sheet:#13151b; --ink:#e8eaee; --ink-1:#c2c7d0; --ink-2:#8790a0; --ink-3:#586070;
  --off:#20242c; --c-ft:#f2f3f5; --c-fl:#f2f3f5; --c-ed:#e0b48c; --c-br:#f2f3f5;
  --accent:#2997ff; --hi:#e8eaee; --rule:#2b303a; color-scheme:dark;
  --hl0:#20242c; --hl1:#2f3541; --hl2:#454d5b; --hl3:#6b7486;
}
html,body{background:var(--sheet);color:var(--ink)}
.caps{font-weight:400;font-size:13px;letter-spacing:0}
.sheet{position:relative;max-width:none;margin:0 auto;padding:max(16px,env(safe-area-inset-left,0px));padding-block:24px 8px}
.viz{display:block;width:min(100%,calc(100vh - 32px));height:auto;max-width:100%;margin:0 auto;overflow:visible;touch-action:manipulation}
.corner{font-size:13px;line-height:1.45;color:var(--ink-2)}
.row{display:flex;justify-content:space-between;gap:32px;align-items:flex-start}
@media (min-width:1200px){.sheet .row{position:absolute;left:max(var(--pm),env(safe-area-inset-left,0px));right:max(var(--pm),env(safe-area-inset-right,0px));pointer-events:none}.sheet .row>*{pointer-events:auto}.rt{top:20px}.rb{bottom:16px;align-items:flex-end}.tl{width:var(--cw)}.bl,.br{width:250px}.tr{width:320px}}
.tl{width:var(--cw)}
.tr{width:var(--cw)}
@media (min-width:1200px){.sheet .tr{width:var(--cw)}}
@media (min-width:1200px){.viz{max-width:calc(100vw - 2 * (var(--cw) + var(--pm)) - 40px)}}
.br{width:300px}
.bl{width:300px}
.title{grid-column:2;margin:0;color:var(--ink);font-weight:400;letter-spacing:-.02em;font-size:24px;line-height:1.12}
.title span{display:block;color:var(--ink-2)}
.head{display:flex;align-items:flex-end;gap:44px;width:max-content}
.head .title{flex:none}
@media (max-width:860px){.head{display:block;width:auto}.head #tag{margin-top:14px!important}}
.tl #tag{grid-column:2;margin:0 0 3px;max-width:46ch;text-wrap:balance;font-size:13px;line-height:1.5;letter-spacing:-.003em;color:var(--ink-2);text-wrap:pretty}
.tl{display:block}
.links{grid-column:2;display:grid;justify-items:start;gap:14px;margin-top:20px}
.btn-dl{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 15px 0 16px;border-radius:999px;background:var(--ink);color:var(--sheet);font-size:12.5px;text-decoration:none;transition:opacity .2s,transform .2s var(--ease)}
.btn-dl:hover{opacity:.88}.btn-dl:active{transform:scale(.97)}
.btn-dl svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.social{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px}
.social a,.social button{color:var(--ink-2);text-decoration:none;transition:color .2s}
.social a:hover,.social button:hover{color:var(--ink)}
.social .ok{color:var(--ink)}
.fig{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:3px}

.fig b{color:var(--ink);font-weight:500;font-feature-settings:'tnum' 1}
.hd{display:flex;align-items:center;gap:10px;color:var(--ink)}
.hd::before{content:'';width:6px;height:6px;flex:0 0 6px;border-radius:50%;background:currentColor}
/* content under a heading lines up with the heading text, not the dot (6px dot + 10px gap) */
.hd ~ :not(.hd){margin-left:16px}
.hd::after{content:'';flex:1;border-top:1px dashed var(--rule)}
.det{margin-top:56px;padding:18px 20px;border-radius:22px;
  background:rgb(26 29 37 / .8);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border:1px solid rgb(255 255 255 / .07);
  box-shadow:inset 0 1px 0 rgb(255 255 255 / .05),0 30px 80px rgb(0 0 0 / .8)}
.det.def .ib[data-act="close"]{display:none}
.det.exp{display:flex;flex-direction:column;overflow:hidden;padding-bottom:8px}
.exp-acc{flex:1 1 auto;min-height:0;overflow:auto;scrollbar-width:none;overscroll-behavior:contain}.exp-acc::-webkit-scrollbar{display:none}
.det.exp .prog{margin:12px 0 4px}
.exp-acc{margin-top:6px}
.exp-acc .ah{grid-template-columns:76px 1fr 18px;padding:9px 0}
.exp-acc .an{font-size:11px}
.exp-acc .ab-p{padding-left:0}
.exp-acc .ab-p h2{margin:2px 0 0}
.exp-acc .ai.open .an{color:var(--accent)}
.ah:focus{outline:none}.ah:focus-visible{box-shadow:0 0 0 1.5px var(--accent);border-radius:8px}
.intro-h{margin:2px 0 0;font-size:19px;line-height:1.35;color:var(--ink);text-wrap:balance;letter-spacing:-.01em;font-weight:400;color:var(--ink)}
.intro-p{margin:6px 0 0;font-size:12.5px;color:var(--ink-2)}
.scrub{margin-top:22px}
.scrub-y{font-size:44px;line-height:1;letter-spacing:-.02em;color:var(--ink);font-feature-settings:'tnum' 1}
.scrub input{-webkit-appearance:none;appearance:none;width:100%;height:20px;margin:12px 0 2px;background:transparent;cursor:pointer;--p:50%}
.scrub input::-webkit-slider-runnable-track{height:2px;border-radius:1px;background:linear-gradient(90deg,var(--ink) var(--p),var(--rule) var(--p))}
.scrub input::-moz-range-track{height:2px;border-radius:1px;background:var(--rule)}
.scrub input::-moz-range-progress{height:2px;background:var(--ink)}
.scrub input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-7px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px rgb(255 255 255 / .08);transition:transform .2s var(--ease)}
.scrub input::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--ink)}
.scrub input:active::-webkit-slider-thumb{transform:scale(1.15)}
.scrub-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);font-feature-settings:'tnum' 1}
.scrub-l{list-style:none;margin:14px 0 0;padding:12px 0 0;border-top:1px solid var(--rule);display:grid;gap:6px;min-height:96px;font-size:12.5px}
.det .scrub-l li{display:flex;justify-content:space-between;gap:10px;grid-template-columns:none;font-size:12.5px;color:var(--ink-1)}.det .scrub-l li::before{content:none}
.scrub-l .k{color:var(--ink-1)}.scrub-l .v{color:var(--ink-2);text-align:right}
.intro-act{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding-top:14px;border-top:1px solid var(--rule)}
.ia-main{display:flex;align-items:center;justify-content:space-between;width:100%;height:48px;margin-top:28px;padding:0 18px 0 20px;border-radius:999px;background:var(--ink);color:var(--sheet);font-size:14px;transition:transform .25s var(--ease),opacity .2s}
.ia-main svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--ease)}
.ia-main:hover svg{transform:translateX(4px)}.ia-main:active{transform:scale(.98)}
.ia-sub{display:block;margin:14px auto 0;color:var(--ink-2);font-size:12.5px;transition:color .2s}.ia-sub:hover{color:var(--ink)}
.det h2{margin:6px 0 0;color:var(--ink);font-size:22px;line-height:1.1;letter-spacing:-.01em;font-weight:400}
.det .co{color:var(--accent);font-weight:500;margin-top:4px}
.det .mt{margin-top:2px;font-feature-settings:'tnum' 1}
.det ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px;color:var(--ink)}
.det li{display:grid;grid-template-columns:14px 1fr;font-size:12px;line-height:1.35}
.det li::before{content:'·';color:var(--ink-3)}
.det-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.cnt{color:var(--ink);font-feature-settings:'tnum' 1}.cnt i{font-style:normal;color:var(--ink-3)}
.ibs{display:flex;gap:6px}
.ib{width:30px;height:30px;border-radius:50%;border:1px solid transparent;background:rgb(255 255 255 / .07);display:grid;place-items:center;color:var(--ink-1);transition:border-color .2s,color .2s,background .2s}
.ib svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ib:hover:not(:disabled){border-color:var(--ink-2);color:var(--ink);background:var(--rule)}
.ib:disabled{opacity:.28;cursor:default}
.prog{display:flex;gap:3px;margin:14px 0 16px}
.prog button{flex:1;height:14px;position:relative}
.prog button::after{content:'';position:absolute;left:0;right:0;top:6px;height:2px;border-radius:1px;background:var(--rule);transition:background .2s,height .2s,top .2s}
.prog button.past::after{background:var(--ink-3)}
.prog button.on::after{background:var(--accent);height:4px;top:5px}
.prog button:hover::after{background:var(--ink-2)}
.det-body{transition:opacity .35s var(--ease),transform .45s var(--ease)}
.det-body.swap{opacity:0;transform:translateY(6px)}
.det-foot{display:flex;justify-content:space-between;gap:12px;margin-top:16px;padding-top:12px;border-top:1px solid var(--rule);font-size:12px}
.det-foot button{color:var(--ink-2);text-align:left;transition:color .2s}.det-foot button:last-child{text-align:right}
.det-foot button:hover{color:var(--ink)}.det-foot span{color:var(--ink-3)}.det-foot .end{color:var(--ink-3)}
.lg{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.lg li{display:flex;align-items:center;gap:9px}
.lg i{width:9px;height:9px;border-radius:50%;flex:0 0 9px}

/* svg */
.viz text{fill:var(--ink);font-family:var(--font)}
.off{fill:var(--off)}
.rh{fill:var(--off)!important}
.wl{stroke:url(#rg);stroke-width:1px;stroke-linecap:round}
.wl-h{fill:var(--ink-1)}
.cap{fill:none;stroke-width:1px}
.cap.k-ft{stroke:var(--c-ft)}.cap.k-fl{stroke:var(--c-fl)}.cap.k-ed{stroke:var(--c-ed)}.cap.k-br{stroke:var(--c-br)}
.spoke .sp-d,.spoke .pin{transition:fill .3s,stroke .3s}
.spoke .pin{fill:var(--sheet);stroke-width:1px}
.spoke.k-ft .sp-d{fill:var(--c-ft)}.spoke.k-fl .sp-d{fill:var(--c-fl)}.spoke.k-ed .sp-d{fill:var(--c-ed)}.spoke.k-br .sp-d{fill:var(--c-br)}
.spoke.k-ft .pin{stroke:var(--c-ft)}.spoke.k-fl .pin{stroke:var(--c-fl)}.spoke.k-ed .pin{stroke:var(--c-ed)}.spoke.k-br .pin{stroke:var(--c-br)}

.d-ft{fill:var(--c-ft)}.d-fl{fill:var(--c-fl)}.d-ed{fill:var(--c-ed)}.d-br{fill:var(--c-br)}
.b-ft{stroke:var(--c-ft)}.b-fl{stroke:var(--c-fl)}.b-ed{stroke:var(--c-ed);stroke-dasharray:2 2.5;stroke-linecap:butt}.b-br{stroke:var(--c-br)}
.cell{stroke:var(--sheet);stroke-width:1.2;transition:fill .3s var(--ease)}
.cell.e{fill:var(--off)}.cell.fu{fill:none;stroke:var(--rule);stroke-dasharray:2 3}
.cell.f{fill:var(--ink)}.cell.h{fill:url(#hatch)}
.hatch-bg{fill:var(--sheet)}.hatch-l{stroke:var(--ink);stroke-width:2.2}
.cell.on{fill:var(--accent)}
.topnav{position:absolute;z-index:3;top:20px;right:max(var(--pm),env(safe-area-inset-right,0px));height:27px;display:flex;align-items:center;gap:28px}
.topnav .links{margin:0;display:block}
.topnav .social{gap:0 24px;font-size:12.5px;flex-wrap:nowrap}
.topnav .social a,.topnav .social button{color:var(--ink-1);letter-spacing:-.003em}
.topnav .social a:hover,.topnav .social button:hover{color:var(--ink)}
.topnav .logo{width:18px}
@media (max-width:860px){.topnav{position:static;justify-content:space-between;margin-bottom:20px}.topnav .social{flex-wrap:wrap;gap:6px 16px}}
.logo{display:block;width:20px;margin:0;color:var(--ink);transition:opacity .2s}.logo:hover{opacity:.7}.logo svg{display:block;width:100%;height:auto;fill:currentColor}
.colo{display:flex;gap:28px;font-size:12px;line-height:1.4;color:var(--ink-2);width:auto!important}
.countries{margin-top:16px}
.countries .t{margin:0 0 6px;color:var(--ink);font-size:13px}
.countries ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:1px 12px}
.countries li{display:flex;align-items:center;gap:8px;font-size:15px;line-height:1.25;letter-spacing:-.01em;color:var(--ink-2)}
.countries li::before{content:'';width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:currentColor}
.countries sup{font-size:9px;letter-spacing:0;align-self:flex-start;margin:2px 0 0 -5px}
.countries li{cursor:pointer;transition:color .2s}
.countries li:hover,.countries li.on{color:var(--ink)}
.countries li.now{color:var(--ink)}
.countries li.on::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--ink);margin-left:2px}
.tr .figs{margin-top:4px;padding-top:12px;border-top:1px solid var(--rule)}
.heart{position:absolute;z-index:1;pointer-events:none;opacity:0;transition:opacity .7s var(--ease);perspective:800px}
.heart.on{opacity:1}

/* ── Dates & durations (inclusive months, matches the PDF) ── */
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const NOW=new Date();

function ym(s){ if(!s) return {y:NOW.getFullYear(),m:NOW.getMonth()+1}; const [y,m]=s.split('-').map(Number); return {y,m}; }
function months(a,b){ const s=ym(a),e=ym(b); return (e.y-s.y)*12+(e.m-s.m)+1; }
function fmtDur(n){ const y=Math.floor(n/12),m=n%12,o=[]; if(y)o.push(y+(y===1?' yr':' yrs')); if(m)o.push(m+(m===1?' mo':' mos')); return o.join(' ')||'1 mo'; }
function fmtRange(r){
  if(r.display && r.kind!=='work') return r.display;
  const a=ym(r.start), s=MONTHS[a.m-1]+' '+a.y;
  if(!r.end) return s+' – Present';
  const b=ym(r.end); return s+' – '+MONTHS[b.m-1]+' '+b.y;
}
function durLabel(r){ return r.kind==='work'?fmtDur(months(r.start,r.end)):''; }
function fy(s,isEnd){ const d=ym(s); return d.y+(d.m-1+(isEnd?1:0))/12; }

    sheet.classList.toggle('has-sel',!!id); svg.classList.toggle('sel',!!id);
    Object.entries(G).forEach(([k,o])=>{const on=k===id;o.g.classList.toggle('on',on);o.spoke&&o.spoke.classList.toggle('on',on);o.stem&&o.stem.classList.toggle('on',on);o.sd&&o.sd.classList.toggle('on',on);});
    document.querySelectorAll('#list li').forEach(li=>li.classList.toggle('on',li.dataset.id===id));
    showCases(id); showSector(id?G[id].c:null);
    if(!id){restoreBadge();showIntro();return;}
    showDet(id);
    const r=byId(id), d=durLabel(r);
    bt1.textContent=yr(r); bt2.textContent=dShort(G[id].c);   // same figure as the pill: 1y sabbatical, 2y Hyper Island, 5y Ortweinschule bt3.textContent=r.company; bt4.textContent=r.title;
  }
  const DEF='A';
  /* role-specific case studies for the right column (titles drawn from the CV; images and links are placeholders) */
  const CASES={
    A:[{t:'Settings redesign',d:'Modernising the core platform settings experience and guidelines.'},{t:'Documents: dashboards & notebooks',d:'Redesigning how teams create, share and act on insights.'}],
    B:[{t:'Reef monitoring tools',d:'AI and IoT tools that track coral reef health in real time.'},{t:'Marine data storytelling',d:'Turning complex reef data into inspiring, accessible experiences.'}],
    C:[{t:'Life sciences · Bayer',d:'Placeholder: project details to come.'},{t:'Automotive · BMW',d:'Placeholder: project details to come.'}],
    D:[{t:'Telehealth patient journeys',d:'Secure, accessible flows shaped with Australian GPs.'}],
    E:[{t:'Cavalry rebrand',d:'A new identity for a motion design software, now part of Canva.'}],
    F:[{t:'ECG analysis workflow',d:'Clinician tools for AI-powered cardiac diagnostics.'}],
    G:[{t:'Live experiences · ASB, Mercedes, Spark NZ',d:'Blending physical and digital touchpoints for live entertainment.'}],
    H:[{t:'Live events · Rufener Events',d:'Placeholder: project details to come.'}],
    J:[{t:'Branding · Frischzellen',d:'Placeholder: project details to come.'}]
  };
  /* ── right card: one accordion; a role adds its case studies on top ── */
  const accEl=document.getElementById('acc');
  const plus='<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1v8M1 5h8"/></svg>';
  const lvl={Native:5,'Full professional proficiency':4,'Professional working proficiency':3,'Limited working proficiency':2,Elementary:1};
  const PROF=[
    ['skills','Skills & tools',CV.skills.length,CV.skills.map(([k,v],i)=>`<div class="sk" style="--i:${i}"><div class="sk-k">${esc(k)}</div><div class="sk-c">${v.split(', ').map(t=>`<span>${esc(t)}</span>`).join('')}</div></div>`).join('')],
    ['training','Training',CV.training.length,CV.training.map((t,i)=>{const j=t.lastIndexOf(', ');return `<div class="tr-l" style="--i:${i}">${esc(t.slice(0,j))}<b>${esc(t.slice(j+2))}</b></div>`;}).join('')],
    ['languages','Languages',CV.languages.length,CV.languages.map(([l,v],i)=>`<div class="lg" style="--i:${i}"><div class="lg-h">${esc(l)}<span>${esc(v)}</span></div><div class="lg-m">${[0,1,2,3,4].map(k=>`<i class="${k<(lvl[v]||3)?'on':''}" style="--s:${k}"></i>`).join('')}</div></div>`).join('')],
    ['patent','Patent',1,`<a class="pt pt-l" href="${LINKS.patent}" target="_blank" rel="noopener">${esc(CV.patent)}</a><a class="pt-src" style="--i:1" href="${LINKS.patent}" target="_blank" rel="noopener">US 2022/0218259 A1 \u00b7 Google Patents \u2197</a>`],
    ['hobbies','Hobbies','',`<blockquote class="qt" style="margin:0 0 0 14px">${esc(CV.quote[0])}</blockquote><p class="qt-a" style="--i:1;margin:6px 0 0 14px">${esc(CV.quote[1])}</p>`]
  ];
  const item=(k,n,t,c,body,cls='')=>`<section class="ai ${cls}" data-k="${k}"><button class="ah" aria-expanded="false"><span class="an">${n}</span><span class="at">${esc(t)}</span><span class="ac">${c}</span><span class="ap">${plus}</span></button><div class="ab"><div class="ab-in"><div class="ab-p">${body}</div></div></div></section>`;
  accEl.innerHTML=item('cases','●','Case studies','','','ai-cases')+PROF.map(([k,t,c,b],i)=>item(k,String(i+1).padStart(2,'0'),t,c,b)).join('');
  const casesAi=accEl.querySelector('[data-k="cases"]'); casesAi.hidden=true;
  let lastProf='skills';
  function openItem(k){accEl.querySelectorAll('.ai').forEach(a=>{const on=a.dataset.k===k;a.classList.toggle('open',on);a.querySelector('.ah').setAttribute('aria-expanded',on);});}
  accEl.addEventListener('click',e=>{const h=e.target.closest('.ah');if(!h)return;const a=h.parentElement,k=a.dataset.k;
    if(a.classList.contains('open')){a.classList.remove('open');h.setAttribute('aria-expanded',false);return;}
    if(k!=='cases')lastProf=k; openItem(k);});
  const refCnt=document.getElementById('ref-cnt'), refSub=document.getElementById('ref-sub');
  function showCases(id){
    const list=id&&CASES[id];
    if(!list){casesAi.hidden=true;refCnt.textContent='Profile';refSub.textContent='Skills, training & more';openItem(null);return;}
    const r=byId(id);
    refCnt.textContent=r.company; refSub.textContent=yr(r);
    casesAi.querySelector('.ac').textContent=Math.min(2,list.length);
    casesAi.querySelector('.ab-p').innerHTML=`<div class="cs-list">`+list.slice(0,2).map((c,i)=>`<article class="case" style="--i:${i}"><div class="case-img"><span>Image placeholder</span></div>
        <div class="case-b"><div class="case-t">${esc(c.t)}</div><div class="case-d">${esc(c.d)}</div>
        <div class="case-f"><span>${esc(String(ym(r.start).y))} · ${esc(r.title)}</span><span class="case-cta">View case study →</span></div></div></article>`).join('')+`</div>`+
      (list.length>1?`<div class="cs-nav"><div class="cs-dots">${list.slice(0,2).map((_,i)=>`<button data-cs="${i}" class="${i?'':'on'}" aria-label="Case study ${i+1}"></button>`).join('')}</div><span class="cs-n">1 / ${Math.min(2,list.length)}</span></div>`:'');
    const cl=casesAi.querySelector('.cs-list'), dots=casesAi.querySelectorAll('[data-cs]'), n=casesAi.querySelector('.cs-n');
    cl.onscroll=()=>{const k=Math.round(cl.scrollLeft/cl.clientWidth);dots.forEach((d,j)=>d.classList.toggle('on',j===k));if(n)n.textContent=`${k+1} / ${dots.length}`;};
    dots.forEach(d=>d.onclick=()=>cl.scrollTo({left:+d.dataset.cs*(cl.clientWidth+10),behavior:'smooth'}));
    casesAi.hidden=false; openItem('cases');
  }
  /* ── left card: every chapter as a collapsed row; selecting one (here or on the ring) opens it ── */
  const ids=ch.map(c=>c.r.id), N=ids.length;
  const ico={l:'<path d="M9.5 3.5 5 8l4.5 4.5"/>',r:'<path d="M6.5 3.5 11 8l-4.5 4.5"/>',x:'<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>'};
  const ib=(k,act,lab)=>`<button class="ib" data-act="${act}" aria-label="${lab}"><svg viewBox="0 0 16 16" aria-hidden="true">${ico[k]}</svg></button>`;
  det.classList.add('exp');
  det.innerHTML=`<div class="det-top"><span class="caps cnt" id="exp-cnt"></span>
      <div class="ibs">${ib('l','prev','Previous chapter')}${ib('r','next','Next chapter')}${ib('x','close','Close details')}</div></div>
    <div class="prog" role="tablist" aria-label="Life journey">${ids.map(x=>`<button data-go="${x}" aria-label="${esc(byId(x).title)}, ${esc(byId(x).company)}"></button>`).join('')}</div>
    <div class="acc exp-acc">${[...ids].reverse().map(id=>{const r=byId(id),d=durLabel(r);
      return `<section class="ai" data-id="${id}"><button class="ah" aria-expanded="false"><span class="an">${esc(yr(r))}</span><span class="at">${esc(r.company)}</span><span class="ap">${plus}</span></button>
      <div class="ab"><div class="ab-in"><div class="ab-p det-body"><h2>${esc(r.title)}</h2>
      ${r.note?`<div class="co">${esc(r.note)}</div>`:''}
      <div class="mt">${esc(r.type)}${r.place?' · '+esc(r.place):''}</div>
      <div class="mt">${esc(fmtRange(r))}${d?' · '+d:''}</div>
      ${r.bullets.length?`<ul>${r.bullets.map(b=>`<li><span>${esc(b)}</span></li>`).join('')}</ul>`:''}</div></div></div></section>`;}).join('')}</div>`;
  const expCnt=det.querySelector('#exp-cnt'), expRows=det.querySelectorAll('.exp-acc .ai'), progB=det.querySelectorAll('.prog button'),
        bPrev=det.querySelector('[data-act=prev]'), bNext=det.querySelector('[data-act=next]'), bClose=det.querySelector('[data-act=close]');
  det.querySelectorAll('.exp-acc .ah').forEach(h=>h.onclick=()=>select(h.parentElement.dataset.id));
  progB.forEach(b=>b.onclick=()=>select(b.dataset.go));
  bPrev.onclick=()=>{const i=ids.indexOf(sel);if(i>0)select(ids[i-1]);};
  bNext.onclick=()=>{const i=ids.indexOf(sel);if(i<N-1)select(ids[i+1]);};
  bClose.onclick=()=>select(null);
  function showDet(id){
    const i=ids.indexOf(id);
    expCnt.innerHTML=id?`Chapter ${String(i+1).padStart(2,'0')} <i>/ ${N}</i>`:`Experience <i>${N}</i>`;
    progB.forEach((b,k)=>{b.className=id?(k===i?'on':k<i?'past':''):'';});
    bPrev.disabled=!id||i<=0; bNext.disabled=!!id&&i>=N-1; bClose.disabled=!id;
    expRows.forEach(a=>{const on=a.dataset.id===id;a.classList.toggle('open',on);a.querySelector('.ah').setAttribute('aria-expanded',on);});
    if(id){const row=det.querySelector(`.exp-acc [data-id="${id}"]`);
      setTimeout(()=>{const L=det.querySelector('.exp-acc'),top=row.offsetTop-L.offsetTop;L.scrollTo({top:Math.max(0,top-8),behavior:REDUCE?'auto':'smooth'});},360);}
    else det.querySelector('.exp-acc').scrollTo({top:0,behavior:REDUCE?'auto':'smooth'});
  }
  function showIntro(){showDet(null);}
  showIntro();
  function go(dir){if(!sel)return;const ids=ch.map(c=>c.r.id),i=ids.indexOf(sel),j=i+dir;if(j>=0&&j<ids.length)select(ids[j]);}
  /* clicking empty space on the poster closes the details */
  svg.addEventListener('click',e=>{if(sel&&!e.target.closest('.spoke')&&!e.target.classList.contains('lhit'))select(null);});
  Object.entries(G).forEach(([id,o])=>{
    o.hit.addEventListener('click',()=>{select(id);if(sel&&matchMedia('(max-width:700px)').matches)setTimeout(()=>det.scrollIntoView({behavior:REDUCE?'auto':'smooth',block:'start'}),420);});
    o.hit.setAttribute('tabindex',0);o.hit.setAttribute('role','button');o.hit.setAttribute('aria-label',`${o.c.r.title}, ${o.c.r.company}, ${fmtRange(o.c.r)}`);
    o.hit.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(id);}});
    const hv=on=>{o.g.classList.toggle('hv',on);o.spoke&&o.spoke.classList.toggle('hv',on);o.stem&&o.stem.classList.toggle('hv',on);svg.classList.toggle('lane-hover',on);};
    o.hit.addEventListener('pointerenter',()=>hv(true));o.hit.addEventListener('pointerleave',()=>hv(false));
    o.hit.addEventListener('focus',()=>hv(true));o.hit.addEventListener('blur',()=>hv(false));
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&sel) select(null);
    if(e.key==='Escape'&&!sel&&indPin){indPin=null;indOff();clearPins();}
    if(sel&&(e.key==='ArrowRight'||e.key==='ArrowDown')){e.preventDefault();go(1);}
    if(sel&&(e.key==='ArrowLeft'||e.key==='ArrowUp')){e.preventDefault();go(-1);}
  });

  /* ── corners, list, band ── */
  document.getElementById('tag').textContent=CV.person.tagline;
  const links=document.getElementById('links');
  links.innerHTML=`<div class="social"><a href="${LINKS.website}" target="_blank" rel="noopener">Website</a><a href="${LINKS.instagram}" target="_blank" rel="noopener">Instagram</a><a href="${LINKS.arena}" target="_blank" rel="noopener">Are.na</a><a href="${LINKS.dribbble}" target="_blank" rel="noopener">Dribbble</a><button id="mail" title="benjamin@gabernig.com">Email</button></div>`;
  /* Email copies the address (mail links are unreliable inside an artifact); falls back to showing it */
  {const mb=document.getElementById('mail'),addr='benjamin@gabernig.com';
   mb.onclick=()=>{const done=t=>{mb.textContent=t;mb.classList.add('ok');clearTimeout(mb._t);mb._t=setTimeout(()=>{mb.textContent='Email';mb.classList.remove('ok');},1800);};
     try{navigator.clipboard.writeText(addr).then(()=>done('Copied'),()=>done(addr));}catch(e){done(addr);}};}
  const work=CV.roles.filter(r=>r.kind==='work');

  const chips=document.getElementById('chips');
  if(chips) IND.forEach(d=>{const b=document.createElement('button');b.className='chip';b.textContent=d.t;b.setAttribute('aria-pressed','false');
    b.onmouseenter=()=>{if(!sel&&!indPin)indOn(d);}; b.onmouseleave=()=>{if(!sel&&!indPin)indOff();};
    b.onclick=()=>{if(sel)select(null);const same=indPin===d;indPin=null;indOff();clearPins();
      if(!same){indPin=d;indOn(d);b.setAttribute('aria-pressed','true');}};
    chips.appendChild(b);});
  /* countries lived in: same highlight as the industry chips */
  const CTRY={'Switzerland':['H'],'Australia':['I'],'New Zealand':['G'],'France':['F'],'Sweden':['edu-hyper'],'Spain':['E'],'Germany':['C'],'Austria':['edu-ortwein','edu-ogilvy','J','A','B']};
  document.querySelectorAll('.countries li').forEach(li=>{
    const name=li.firstChild.textContent.trim(), when=li.querySelector('sup').textContent.replace('/','');
    const d={t:name,kind:'Lived in',when:when.replace(/y$/,' years').replace(/m$/,' months'),ids:CTRY[name]||[],yrs:new Set(),sp:[]};
    li.tabIndex=0; li.setAttribute('role','button');
    li.onmouseenter=()=>{if(!sel&&!indPin)indOn(d);}; li.onmouseleave=()=>{if(!sel&&!indPin)indOff();};
    const pick=()=>{if(sel)select(null);const same=indPin===d;indPin=null;indOff();clearPins();if(!same){indPin=d;indOn(d);li.classList.add('on');}};
    li.onclick=pick; li.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick();}};
  });
  const list=document.getElementById('list');
  [...ch].reverse().forEach(c=>{const r=c.r,li=document.createElement('li');li.dataset.id=r.id;
    li.innerHTML=`<button><span class="y">${esc(yr(r))}</span><b>${esc(r.title)}</b><span class="c">${esc(r.company)}</span></button>`;
    li.querySelector('button').onclick=()=>{select(r.id);document.querySelector('.tr').scrollIntoView({behavior:'smooth',block:'start'});};list.appendChild(li);});
  /* intro: bars, then lanes inside-out, then labels */
  if(!REDUCE){
    svg.classList.add('intro');
    const lanes=ch.map(c=>G[c.r.id].g);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      svg.classList.remove('intro');
      gY.style.transitionDelay='0s'; gBars.style.transitionDelay='.15s';
      lanes.forEach((l,i)=>l.style.transitionDelay=(.35+i*.07)+'s');
      gS.querySelectorAll('.spoke').forEach((s,i)=>s.style.transitionDelay=(1.1+i*.05)+'s');
      setTimeout(()=>{lanes.forEach(l=>l.style.transitionDelay='');gS.querySelectorAll('.spoke').forEach(s=>s.style.transitionDelay='');},2600);
    }));
  }
})();
</script>
</body>
</html>
